name: Pull Request Automated Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  pr-checks:
    # Pinned to a commit (SEC-18). Bump it in a pull request when the shared workflow changes.
    uses: Nano-Collective/.github/.github/workflows/pr-checks.yml@c64bf21e013bd713a43ee3eae166b97d1fb6ad41
    with:
      build-output-dir: out
      validate-changesets: true
      coverage-threshold: 80
      fail-on-coverage-drop: false
