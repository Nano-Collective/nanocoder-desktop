name: nc-review

on:
  pull_request_target:
    types: [opened]
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

concurrency:
  group: nc-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  nc-review:
    uses: Nano-Collective/.github/.github/workflows/nc-review.yml@c64bf21e013bd713a43ee3eae166b97d1fb6ad41
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      pr-number: ${{ inputs.pr_number }}
      architecture-doc: AGENTS.md
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
