name: Desktop Checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preflight-compile-cache-${{ github.ref }}
  cancel-in-progress: false

env:
  NANOCODER_REF: fc01e239a80ddb2e09ca174e3c909508832d5340

jobs:
  windows-preflight-compile-cache:
    name: Windows ACP compile-cache experiment
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Nano-Collective/nanocoder
          ref: ${{ env.NANOCODER_REF }}
          path: .nanocoder-build

      - working-directory: .nanocoder-build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Alternate 10 fresh-cache probes per condition
        env:
          NANOCODER_CLI: ${{ github.workspace }}/.nanocoder-build/dist/cli.js
        run: pnpm exec ava --config ava.acp.config.js source/main/nanocoder/compile-cache-experiment.acp.ts
