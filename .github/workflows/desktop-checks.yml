# EXPERIMENT ONLY. Never merge this workflow into a product branch.
name: PERF-03 macOS recents experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf03-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  perf03-experiment:
    name: Alternating A/B PERF-03 (macOS, Node 22)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Validate unchanged budgets and build both instrumented variants
        run: node scripts/perf03-ci-experiment.mjs build

      - name: Run ten alternating A/B pairs without retries
        env:
          NANOCODER_CLI: ''
          NANOCODER_E2E_VISIBLE: ''
        run: node scripts/perf03-ci-experiment.mjs run --pairs 10

      - name: Upload content-free experiment evidence, including failed samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf03-macos-experiment
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .qa/perf03-experiment/artifacts/*.json
            .qa/perf03-experiment/artifacts/*.log
            .qa/perf03-experiment/artifacts/*.patch
            .qa/perf03-experiment/artifacts/runs/**/run.log
            .qa/perf03-experiment/artifacts/runs/**/perf03.json
            .qa/perf03-experiment/artifacts/runs/**/perf03-experiment.json
