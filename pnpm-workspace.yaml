packages:
  - .

minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade

# 2023 security-fix releases that predate npm provenance (Nanocoder allows 5.7.2 too).
# pnpm honours one entry per package, so both versions share one.
trustPolicyExclude:
  - 'semver@5.7.2 || 6.3.1'

# Electron security releases must apply at once.
minimumReleaseAgeExclude:
  - electron

allowBuilds:
  electron: true
  # Only used for Squirrel installers; we build NSIS.
  electron-winstaller: false
  esbuild: true
  node-pty: true

# Dev-only (electron-builder -> ajv). Remove once ajv requires a patched fast-uri.
overrides:
  fast-uri: ^3.1.9
