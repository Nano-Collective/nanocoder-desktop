appId: org.nanocollective.nanocoder-desktop
productName: Nanocoder Desktop
artifactName: nanocoder-desktop-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!e2e/**'
  - '!.qa/**'
asarUnpack:
  - '**/*.node'
npmRebuild: true
mac:
  category: public.app-category.developer-tools
  # electron-updater needs the .zip.
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  category: Development
  executableName: nanocoder-desktop
  syncDesktopName: true
  maintainer: Nano Collective <hello@nanocollective.org>
  target:
    - AppImage
    - deb
deb:
  packageName: nanocoder-desktop
publish: null
