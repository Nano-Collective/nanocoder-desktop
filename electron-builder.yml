appId: org.nanocollective.nanocoder-desktop
productName: Nanocoder Desktop
artifactName: nanocoder-desktop-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - THIRD-PARTY-NOTICES.txt
  - '!e2e/**'
  - '!.qa/**'
# The pinned Node and Nanocoder a packaged app runs, staged by scripts/prepare-runtime.mjs (REL-02, REL-04).
extraResources:
  - from: .cache/runtime
    to: runtime
    filter:
      - '**/*'
      - '!.stamp'
asarUnpack:
  - '**/*.node'
  - '**/node-pty/**'
npmRebuild: true
buildDependenciesFromSource: true
mac:
  category: public.app-category.developer-tools
  # electron-updater needs the .zip.
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  category: Development
  executableName: nanocoder-desktop
  syncDesktopName: true
  maintainer: Nano Collective <hello@nanocollective.org>
  target:
    - AppImage
    - deb
deb:
  packageName: nanocoder-desktop
publish: null
