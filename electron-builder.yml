appId: org.nanocollective.nanocoder-desktop
productName: Nanocoder Desktop
artifactName: nanocoder-desktop-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - THIRD-PARTY-NOTICES.txt
  - '!e2e/**'
  - '!.qa/**'
# The pinned Node and Nanocoder a packaged app runs, staged by scripts/prepare-runtime.mjs (REL-02, REL-04).
# Set at packaging time (SEC-19). scripts/lib/fuses.mjs holds the reasons, and a spec keeps the two in step.
# Flipping fuses edits the Electron binary, so an unsigned arm64 build needs its ad hoc signature redone to run.
electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableCookieEncryption: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
extraResources:
  - from: .cache/runtime
    to: runtime
    filter:
      - '**/*'
      - '!.stamp'
asarUnpack:
  - '**/*.node'
  - '**/node-pty/**'
npmRebuild: true
buildDependenciesFromSource: true
mac:
  category: public.app-category.developer-tools
  # electron-updater needs the .zip.
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  category: Development
  executableName: nanocoder-desktop
  syncDesktopName: true
  maintainer: Nano Collective <hello@nanocollective.org>
  target:
    - AppImage
    - deb
deb:
  packageName: nanocoder-desktop
publish: null
